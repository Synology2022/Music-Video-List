<!DOCTYPE html>
<html lang="it">
<head>

<title>Database musicale Mancini Alessandro</title>
<style>

.ftag.bd{--c:#1e88e5}.ftag.dvd{--c:#9e9e9e}.ftag.bda{--c:#00acc1}.ftag.dvda{--c:#ab47bc}.ftag.sacd{--c:#d4a017}
.ftag.solid,.ftag.on{background:var(--c);color:#fff}.ftag.sacd.solid,.ftag.sacd.on,.ftag.dvd.solid,.ftag.dvd.on{color:#111}
#tabs .ftag,#filters .ftag,#tbar .ftag{cursor:pointer;opacity:.75}#tabs .ftag.on,#filters .ftag.on,#tbar .ftag.on,#tabs .ftag:hover,#filters .ftag:hover,#tbar .ftag:hover{opacity:1}
#tools{position:fixed;right:calc(60*var(--u));top:calc(88*var(--u));display:flex;gap:calc(14*var(--u));align-items:center;font-size:calc(18*var(--u))}
#search{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);color:var(--fg);font:inherit;padding:calc(6*var(--u)) calc(12*var(--u));width:calc(360*var(--u));border-radius:calc(4*var(--u));outline:none}
#search:focus{border-color:var(--blue)}
.tbtn{color:var(--dim);cursor:pointer;border:1px solid rgba(255,255,255,.25);padding:calc(5*var(--u)) calc(12*var(--u));border-radius:calc(4*var(--u))}

#row{position:fixed;left:0;right:0;top:calc(150*var(--u));height:calc(600*var(--u))}
.card{position:absolute;top:0;transition:left .28s ease,top .28s ease,width .28s ease,height .28s ease,opacity .28s ease;cursor:pointer;background:#111;box-shadow:0 calc(8*var(--u)) calc(26*var(--u)) rgba(0,0,0,.6)}
.card img{width:100%;height:100%;object-fit:contain;display:block;background:#0b0b0b}

.card.focus{outline:calc(3*var(--u)) solid rgba(255,255,255,.9);outline-offset:0}
.card .badge{position:absolute;right:calc(8*var(--u));top:calc(8*var(--u));display:flex;gap:calc(4*var(--u))}
.card .badge i{font-style:normal;font-size:calc(13*var(--u));font-weight:600;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.45);padding:0 calc(5*var(--u));border-radius:calc(3*var(--u))}
#info{position:fixed;top:calc(682*var(--u));right:calc(60*var(--u))}
#title{font-size:calc(42*var(--u));font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#flags{position:fixed;left:calc(60*var(--u));right:calc(60*var(--u));bottom:calc(52*var(--u));display:flex;gap:calc(22*var(--u));align-items:center;flex-wrap:nowrap}
.flag{border:1px solid rgba(255,255,255,.6);border-radius:calc(5*var(--u));padding:calc(3*var(--u)) calc(10*var(--u));font-size:calc(21*var(--u));font-weight:700;letter-spacing:.02em;white-space:nowrap;text-transform:uppercase}
.flag.res{background:#c62828;border-color:#c62828}

#sortp .opt i{font-style:normal;width:1.5em;height:1.5em;border:1px solid rgba(255,255,255,.4);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.85em}
#sortp .opt.on i{background:var(--blue);border-color:var(--blue);color:#fff}
#sortp .note{color:var(--dim);font-size:.8em;margin-top:calc(10*var(--u))}
#filters label{display:flex;justify-content:space-between;align-items:center;margin:calc(8*var(--u)) 0;gap:calc(14*var(--u))}
#filters select{background:#111;color:var(--fg);border:1px solid rgba(255,255,255,.3);font:inherit;padding:calc(4*var(--u));width:60%}
/* detail */
#detail{position:fixed;inset:0;z-index:30;display:none;background:rgba(0,0,0,.86);backdrop-filter:blur(6px)}
#dbg{position:absolute;inset:0;background:center/cover no-repeat;filter:brightness(.25) blur(2px)}
#dwrap{position:absolute;inset:calc(60*var(--u));display:flex;gap:calc(50*var(--u))}
#dposter{height:100%;max-width:42%;flex:none;display:flex;flex-direction:column;gap:calc(16*var(--u))}
#dposter img{max-height:100%;max-width:100%;object-fit:contain;box-shadow:0 calc(10*var(--u)) calc(30*var(--u)) rgba(0,0,0,.7)}
#dtext{flex:1;overflow:auto;padding-right:calc(20*var(--u))}
#dtext::-webkit-scrollbar{width:calc(8*var(--u))}#dtext::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25)}
#dlogo{max-height:calc(110*var(--u));max-width:70%;margin-bottom:calc(10*var(--u))}

#dplot{font-size:calc(22*var(--u));line-height:1.5;color:rgba(255,255,255,.85);white-space:pre-line}
.grid{display:grid;grid-template-columns:calc(220*var(--u)) 1fr;gap:calc(8*var(--u)) calc(20*var(--u));font-size:calc(20*var(--u));margin-top:calc(24*var(--u))}
.grid div:nth-child(odd){color:var(--dim);text-transform:uppercase;font-size:.85em;padding-top:.15em}
.grid code{font-family:Consolas,monospace;font-size:.85em;color:#cfe7f5;word-break:break-all}
#dflags{display:flex;flex-wrap:wrap;gap:calc(14*var(--u));margin:calc(18*var(--u)) 0}
.tracks{margin-top:calc(20*var(--u));font-size:calc(20*var(--u))}

.tracks span:nth-child(2){flex:1}
/* summary table */
#table{position:fixed;inset:0;z-index:28;display:none;background:#06090d;padding:calc(30*var(--u)) calc(40*var(--u));flex-direction:column}
#tbar{display:flex;flex-wrap:wrap;gap:calc(10*var(--u)) calc(14*var(--u));align-items:center;font-size:calc(17*var(--u))}
#tbar h2{font-weight:300;font-size:calc(34*var(--u));margin:0 calc(20*var(--u)) 0 0;text-transform:uppercase;letter-spacing:.03em}
#tbar select,#tbar input{background:#111;color:var(--fg);border:1px solid rgba(255,255,255,.3);font:inherit;padding:calc(4*var(--u)) calc(6*var(--u));max-width:calc(230*var(--u))}
#tbar input{width:calc(260*var(--u))}
#tbar label{color:var(--dim);display:flex;gap:calc(6*var(--u));align-items:center}
#tstats{display:none;color:var(--dim);font-size:calc(17*var(--u));margin:calc(12*var(--u)) 0}
#tstats b{color:var(--blue);font-weight:400}
#twrap{flex:1;overflow:auto;border-top:1px solid rgba(255,255,255,.15)}
#twrap::-webkit-scrollbar{width:calc(10*var(--u));height:calc(10*var(--u))}#twrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25)}
#tt{border-collapse:collapse;width:100%;font-size:calc(16*var(--u))}
#tt th{position:sticky;top:0;background:#141a22;text-align:left;font-weight:600;padding:calc(8*var(--u)) calc(8*var(--u));cursor:pointer;white-space:nowrap;color:var(--dim);text-transform:uppercase;font-size:.85em}
#tt th.on{color:var(--fg)}
#tt td{padding:calc(5*var(--u)) calc(8*var(--u));border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap;max-width:calc(560*var(--u));overflow:hidden;text-overflow:ellipsis}
#tt tr:hover td{background:rgba(18,167,222,.14)}
#tt th.ns{cursor:default}
#tt select.trk{background:#111;color:var(--fg);border:1px solid rgba(255,255,255,.3);font:inherit;padding:0 calc(2*var(--u));cursor:pointer}
#tt .ibtn{display:inline-flex;align-items:center;justify-content:center;width:1.4em;height:1.4em;border-radius:50%;border:1px solid var(--blue);color:var(--blue);font-style:italic;font-weight:600;font-family:Georgia,serif;cursor:pointer}
#tt .ibtn:hover{background:var(--blue);color:#fff}
#tt .chip.fBD{background:#1565c0;border-color:#1565c0}#tt .chip.fBDA{background:#0d3c7a;border-color:#4f8ad6}
#tt .chip.fDVD{background:#555;border-color:#555}#tt .chip.fDVDA{background:#6a1b9a;border-color:#6a1b9a}#tt .chip.fSACD{background:#a77d0a;border-color:#d4a017}
#tbar .back{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
#tt td.n{text-align:right;color:var(--dim)}
#tt .chip{display:inline-block;border:1px solid rgba(255,255,255,.4);border-radius:3px;padding:0 .35em;font-size:.85em;margin-right:.25em}
#tt .chip.k4{background:#d4a017;color:#111;border-color:#d4a017}#tt .chip.hd{background:#1565c0;border-color:#1565c0}#tt .chip.sd{background:#c62828;border-color:#c62828}
#detail{z-index:40}
.grid .gsec{color:var(--blue);text-transform:uppercase;font-size:.8em;letter-spacing:.05em;padding-top:calc(14*var(--u));border-top:1px solid rgba(255,255,255,.12);margin-top:calc(6*var(--u))}
.grid a{color:var(--blue)}
#dclose{position:absolute;right:calc(30*var(--u));top:calc(18*var(--u));font-size:calc(34*var(--u));cursor:pointer;color:var(--dim);z-index:2}
</style>
</head>
<body>
<div id="bg"></div><div id="bg2"></div><div id="shade"></div>
<div id="head"><svg viewBox="0 0 24 24" id="secicon"></svg><div><div id="secname"></div><div id="subline"></div></div></div>
<div id="tabs"></div>
<div id="tools">
  <input id="search" placeholder="Cerca titolo o artista...  ( / )" autocomplete="off">
  <span class="tbtn" id="sortbtn" title="Ordina (S)">Ordina</span>
  <span class="tbtn" id="filtbtn" title="Filtri (F)">Filtri</span>
  <span class="tbtn" id="tablebtn" title="Tabella riepilogativa (T)">Tabella</span>
</div>
<div id="filters"></div><div id="sortp"></div>
<div id="row"></div>
<div id="info"><div id="title"></div><div id="genre"></div><div id="plot"></div></div>
<div id="flags"></div>
<div id="empty">Nessun elemento</div>
<div id="hint">&larr; &rarr; scorri &nbsp;&middot;&nbsp; Invio dettagli &nbsp;&middot;&nbsp; &uarr; &darr; formato &nbsp;&middot;&nbsp; 1-5 tag &nbsp;&middot;&nbsp; / cerca &nbsp;&middot;&nbsp; S ordina &nbsp;&middot;&nbsp; F filtri &nbsp;&middot;&nbsp; T tabella &nbsp;&middot;&nbsp; Esc indietro</div>
<div id="foot"></div>
<div id="table">
  <div id="tbar"></div>
  <div id="tstats"></div>
  <div id="twrap"><table id="tt"><thead></thead><tbody></tbody></table></div>
</div>
<div id="detail"><div id="dbg"></div><div id="dclose">&times;</div><div id="dwrap"><div id="dposter"></div><div id="dtext"></div></div></div>
<script src="data.js?v=20261124162922"></script>
<script>
(function () {
'use strict';
const A = window.ARCHIVIO || {meta: {}, items: []};
const ICONS = {
  musicvideo: 'M21 3v12.5a3.5 3.5 0 1 1-2-3.16V7H9v10.5A3.5 3.5 0 1 1 7 14.34V3h14z',
  movie: 'M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V4h-4z',
  documentary: 'M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z',
  music: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 12.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7zm0-5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z'
};
const FORMATS = [
  {id: 'Blu-Ray', cls: 'bd'}, {id: 'DVD', cls: 'dvd'}, {id: 'BD-Audio', cls: 'bda'}, {id: 'DVD-Audio', cls: 'dvda'}, {id: 'SACD', cls: 'sacd'}
].filter(f => A.items.some(i => i.fmt === f.id));
const FMT_ORDER = FORMATS.map(f => f.id);
function tag(fmt, extra, attrs) {
  const f = FORMATS.find(x => x.id === fmt) || {cls: ''};
  return '<span class="ftag ' + f.cls + ' ' + (extra || '') + '"' + (attrs || '') + '>' + esc(fmt || '') + '</span>';
}
const SORTS = {
  artist: {name: 'Artista', f: (a, b) => cmp(a.artist || a.title, b.artist || b.title)},
  title: {name: 'Nome', f: (a, b) => cmp(a.title, b.title)},
  fmt: {name: 'Tipologia disco', f: (a, b) => FMT_ORDER.indexOf(a.fmt) - FMT_ORDER.indexOf(b.fmt)}
};
const coll = new Intl.Collator('it', {sensitivity: 'base', numeric: true});
function cmp(a, b) { return coll.compare(String(a || ''), String(b || '')); }
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const save = (k, v) => { try { localStorage.setItem('archivio.' + k, JSON.stringify(v)); } catch (e) {} };
const load = (k, d) => { try { const v = localStorage.getItem('archivio.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };

let fsel = load('fsel', []).filter(f => FMT_ORDER.includes(f));
let sortKeys = load('sortk', ['artist']).filter(k => SORTS[k]);
if (!sortKeys.length) sortKeys = ['artist'];
function sortFn(a, b) {
  for (const k of sortKeys) { const r = SORTS[k].f(a, b); if (r) return r; }
  return cmp(a.artist || a.title, b.artist || b.title) || cmp(a.title, b.title) || (a.year || 0) - (b.year || 0);
}
let query = '';
let list = [];
let pos = 0;
const cards = new Map();

function hms(s) {
  s = Math.round(s || 0); if (!s) return '';
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? h + ' h ' + String(m).padStart(2, '0') + ' min' : m + ' min';
}
function mmss(s) { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function audioMain(it) { return (it.audio && it.audio[0]) || null; }
function profiles(it) { return Object.keys(it.copies || {}).sort(); }
function matches(it) {
  if (fsel.length && !fsel.includes(it.fmt)) return false;
  if (query) {
    const hay = [it.title, it.fulltitle, it.artist, it.album, it.year].join(' ').toLowerCase();
    if (!query.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function rebuild(keepId) {
  list = A.items.filter(matches).sort(sortFn);
  pos = 0;
  if (keepId != null) { const i = list.findIndex(x => x.id === keepId); if (i >= 0) pos = i; }
  else { const last = load('pos', null); const i = list.findIndex(x => x.id === last); if (i >= 0) pos = i; }
  for (const c of cards.values()) c.remove();
  cards.clear();
  drawHeader();
  render();
}

function drawHeader() {
  $('secicon').innerHTML = '<path d="' + ICONS.musicvideo + '"/>';
  const day = (A.meta.created || '').split(' ')[0];
  const name = 'Database musicale Mancini Alessandro' + (day ? ' al: ' + day : '');
  $('secname').textContent = name;
  $('subline').innerHTML = (fsel.length ? esc(fsel.join(' + ')) + ' &bull; ' : '') + '<b>' + list.length + '</b>' + (list.length !== A.items.length ? ' di ' + A.items.length : '') +
    ' elementi &bull; ordina per: ' + sortKeys.map(k => SORTS[k].name).join(' &rsaquo; ') +
    (query ? ' &bull; ricerca: &quot;' + esc(query) + '&quot;' : '');
  $('tabs').innerHTML = FORMATS.map(f => tag(f.id, fsel.includes(f.id) ? 'on' : '', ' data-f="' + esc(f.id) + '"')
    .replace('</span>', '<small>' + A.items.filter(i => i.fmt === f.id).length + '</small></span>')).join('');
  $('empty').style.display = list.length ? 'none' : 'block';
  document.title = name + (fsel.length ? ' - ' + fsel.join(' + ') : '');
}

/* ---- the row of posters: the focused one big on the left, the next ones smaller ---- */
function ratioOf(it) { return it && it.sec === 'music' ? 1 : 2 / 3; }
function geometry() {
  const u = window.innerHeight / 1080;
  return {u, bigH: 600 * u, smallH: 380 * u, gap: 22 * u, left: 60 * u, smallTop: 120 * u};
}
function makeCard(it) {
  const d = document.createElement('div');
  d.className = 'card';
  const badges = [];
  if (profiles(it).length) badges.push(profiles(it).join(' '));
  d.innerHTML = (it.poster ? '<img loading="lazy" src="' + esc(it.poster) + '" alt="">' : '<div class="ph">' + esc(it.fulltitle || it.title) + '</div>') +
    '<div class="badge">' + badges.map(b => '<i>' + esc(b) + '</i>').join('') + '</div>';
  const img = d.querySelector('img');
  if (img) img.onerror = () => { img.remove(); d.insertAdjacentHTML('afterbegin', '<div class="ph">' + esc(it.fulltitle || it.title) + '</div>'); };
  d.addEventListener('click', () => { const i = list.indexOf(it); if (i === pos) openDetail(); else { pos = i; render(); } });
  $('row').appendChild(d);
  return d;
}
function render() {
  const g = geometry();
  const W = window.innerWidth;
  const want = new Set();
  const first = Math.max(0, pos - 1);
  let x = g.left;
  // previous item peeks out on the left edge
  for (let i = first; i < list.length; i++) {
    const it = list[i];
    let L, T, w, h;
    const r = ratioOf(it);
    if (i < pos) { w = g.smallH * r; h = g.smallH; L = g.left - w - g.gap; T = g.smallTop; }
    else if (i === pos) { w = g.bigH * r; h = g.bigH; L = g.left; T = 0; x = L + w + g.gap * 1.6; }
    else { w = g.smallH * r; h = g.smallH; L = x; T = g.smallTop; x += w + g.gap; }
    if (L > W + g.smallH) break;
    want.add(it.id);
    let c = cards.get(it.id);
    if (!c) { c = makeCard(it); cards.set(it.id, c); c.style.left = (L + (i > pos ? w : 0)) + 'px'; c.style.top = T + 'px'; c.style.width = w + 'px'; c.style.height = h + 'px'; c.offsetWidth; }
    c.style.left = L + 'px'; c.style.top = T + 'px'; c.style.width = w + 'px'; c.style.height = h + 'px';
    c.classList.toggle('focus', i === pos);
  }
  for (const [id, c] of cards) if (!want.has(id)) { c.remove(); cards.delete(id); }
  // info block under the small posters
  $('info').style.left = (g.left + g.bigH * ratioOf(list[pos]) + g.gap * 1.6) + 'px';
  const it = list[pos];
  if (!it) { $('title').textContent = ''; $('genre').textContent = ''; $('plot').textContent = ''; $('flags').innerHTML = ''; setBg(''); return; }
  $('title').textContent = it.artist && it.sec !== 'movie' && it.sec !== 'documentary' ? it.artist + ': ' + it.title : it.title;
  $('genre').textContent = [(it.genre || []).join(' / '), it.year, hms(it.runtime)].filter(Boolean).join('   •   ');
  $('plot').textContent = it.plot || it.tagline || '';
  $('flags').innerHTML = flagsHtml(it, true);
  setBg(it.fanart || it.poster);
  save('pos', it.id);
}
let bgCur = '', bgTimer = 0;
function setBg(url) {
  if (url === bgCur) return;
  bgCur = url;
  clearTimeout(bgTimer);
  bgTimer = setTimeout(() => {   // only when the selection stays for a moment
    const a = $('bg'), b = $('bg2');
    const top = a.style.opacity === '0' ? a : b, under = top === a ? b : a;
    top.style.backgroundImage = url ? 'url("' + url.replace(/"/g, '%22') + '")' : 'none';
    top.style.opacity = '1'; under.style.opacity = '0';
  }, 180);
}
function stars(r) {
  if (r == null || r <= 0) return '';
  const n = Math.round(r / 2);
  return '<span class="stars" title="' + r + '/10">' + '★'.repeat(n) + '<s>' + '★'.repeat(5 - n) + '</s></span>';
}
function flagsHtml(it, compact) {
  const f = [];
  if (it.fmt) f.push(tag(it.fmt, 'solid flag'));
  const v = it.video;
  if (v && v.res) f.push('<span class="flag res ' + (v.res === '4K' ? 'k4' : (v.res === '1080p' || v.res === '720p') ? 'hd' : '') + '">' + esc(v.res) + '</span>');
  if (v && v.hdr) f.push('<span class="flag">' + esc(v.hdr) + '</span>');
  if (v && v['3d']) f.push('<span class="flag">3D</span>');
  f.push(stars(it.rating));
  if (v && v.codec) f.push('<span class="flag">' + esc(v.codec) + '</span>');
  const a = audioMain(it);
  if (a && a.codec) f.push('<span class="flag">' + esc(a.codec) + '</span>');
  if (a && a.ch) f.push('<span class="flag">' + esc(a.ch) + '</span>');
  if (v && v.aspect) f.push('<span class="flag">' + esc(v.aspect) + '</span>');
  if (!compact && it.audio && it.audio.length > 1) f.push('<span class="flag dim">+' + (it.audio.length - 1) + ' tracce audio</span>');
  profiles(it).forEach(p => f.push('<span class="flag prof" title="' + esc(it.copies[p]) + '">' + esc(p) + '</span>'));
  if (compact && it.playcount) f.push('<span class="flag dim">✔ visto</span>');
  return f.filter(Boolean).join('');
}

/* ---- detail page (Invio) ---- */
function openDetail(item) {
  const it = item || list[pos]; if (!it) return;
  $('dbg').style.backgroundImage = it.fanart ? 'url("' + it.fanart + '")' : 'none';
  $('dposter').innerHTML = (it.poster ? '<img src="' + esc(it.poster) + '">' : '') + (it.disc ? '<img src="' + esc(it.disc) + '" style="max-height:30%;align-self:center">' : '');
  const rowsI = [];
  const add = (k, v) => { if (v && (!Array.isArray(v) || v.length)) rowsI.push('<div>' + k + '</div><div>' + (Array.isArray(v) ? esc(v.join(', ')) : v) + '</div>'); };
  add('Artista', esc(it.artist));
  add('Album', esc(it.album));
  add('Titolo originale', esc(it.original));
  add('Anno', esc(it.year));
  add('Durata', esc(hms(it.runtime)));
  add('Genere', it.genre);
  add('Regia', it.director);
  add('Sceneggiatura', it.writer);
  add('Studio / etichetta', it.studio);
  add('Paese', it.country);
  add('Saga', esc(it.set));
  add('Voto', it.rating ? esc(it.rating + ' / 10' + (it.votes ? '  (' + it.votes + ' voti)' : '')) : '');
  add('Formato', it.fmt ? tag(it.fmt, 'solid') : '');
  if (it.video) add('Video', esc([it.video.codec, it.video.w && it.video.h ? it.video.w + '×' + it.video.h : '', it.video.res, it.video.hdr, it.video.aspect].filter(Boolean).join('  ·  ')));
  if (it.audio && it.audio.length) add('Audio', it.audio.map(a => esc([a.codec, a.ch, a.rate ? (typeof a.rate === 'number' ? (a.bits ? a.bits + '/' : '') + a.rate + ' kHz' : a.rate) : '', a.lang].filter(Boolean).join(' '))).join('<br>'));
  add('Sottotitoli', it.subs);
  add('Interpreti', it.cast);
  add('Aggiunto', esc(it.added));
  add('Ultima visione', esc(it.played ? it.played + (it.playcount ? '  (' + it.playcount + ' volte)' : '') : ''));
  add('IMDb', it.imdb ? '<code>' + esc(it.imdb) + '</code>' : '');
  Object.keys(it.copies || {}).sort().forEach(p => add('Copia su ' + esc(p), '<code>' + esc(it.copies[p]) + '</code>'));
  let tracks = '';
  if (it.tracks && it.tracks.length) {
    const multi = (it.discs || 1) > 1;
    tracks = '<div class="tracks">' + it.tracks.map(t => '<div><span>' + (multi ? t.disc + '.' : '') + t.n + '</span><span>' + esc(t.title) +
      '</span><span>' + mmss(t.secs) + '</span></div>').join('') + '</div>';
  }
  $('dtext').innerHTML = (it.logo ? '<img id="dlogo" src="' + esc(it.logo) + '" onerror="this.remove()">' : '') +
    '<div id="dtitle">' + esc(it.title) + '</div>' +
    '<div id="dsub">' + esc([it.artist, it.year, (it.genre || []).join(' / ')].filter(Boolean).join('   •   ')) + '</div>' +
    (it.tagline ? '<div id="dtag">' + esc(it.tagline) + '</div>' : '') +
    '<div id="dflags">' + flagsHtml(it, false) + '</div>' +
    '<div id="dplot">' + esc(it.plot) + '</div>' + tracks +
    '<div class="grid">' + rowsI.join('') + '</div>';
  $('dtext').scrollTop = 0;
  $('detail').style.display = 'block';
}
function closeDetail() { $('detail').style.display = 'none'; }

/* ---- filters / sort / sections ---- */
function toggleFmt(f) {
  fsel = fsel.includes(f) ? fsel.filter(x => x !== f) : fsel.concat([f]);
  fsel.sort((a, b) => FMT_ORDER.indexOf(a) - FMT_ORDER.indexOf(b));
  save('fsel', fsel);
  const id = list[pos] && list[pos].id;
  rebuild(id);
  if ($('filters').style.display === 'block') drawFilters();
  if (tableOpen()) { drawTableBar(); drawTable(); }
}
function setFormats(arr) { fsel = arr; save('fsel', fsel); rebuild(); if ($('filters').style.display === 'block') drawFilters(); }
function drawFilters() {
  $('filters').innerHTML = '<div class="ptitle">Mostra (uno o piu\')</div><div class="tags">' +
    FORMATS.map(f => tag(f.id, fsel.includes(f.id) ? 'on' : '', ' data-f="' + esc(f.id) + '"')
      .replace('</span>', '<small>' + A.items.filter(i => i.fmt === f.id).length + '</small></span>')).join('') +
    '</div><div style="text-align:right;margin-top:14px"><span class="tbtn" id="freset">Tutti</span></div>';
  $('freset').onclick = () => setFormats([]);
}
function toggleFilters(show) {
  const f = $('filters');
  const on = show != null ? show : f.style.display !== 'block';
  if (on) toggleSort(false);
  f.style.display = on ? 'block' : 'none';
  $('filtbtn').classList.toggle('on', on);
  if (on) drawFilters();
}
function drawSort() {
  $('sortp').innerHTML = '<div class="ptitle">Ordina per (clic in sequenza per piu\' criteri)</div>' +
    Object.entries(SORTS).map(([k, S]) => {
      const n = sortKeys.indexOf(k);
      return '<div class="opt' + (n >= 0 ? ' on' : '') + '" data-k="' + k + '"><i>' + (n >= 0 ? n + 1 : '') + '</i>' + S.name + '</div>';
    }).join('') + '<div class="note">Es.: 1 Tipologia disco, 2 Artista</div>';
}
function toggleSort(show) {
  const p = $('sortp');
  const on = show != null ? show : p.style.display !== 'block';
  if (on) toggleFilters(false);
  p.style.display = on ? 'block' : 'none';
  $('sortbtn').classList.toggle('on', on);
  if (on) drawSort();
}
function pickSort(k) {
  if (sortKeys.includes(k)) { if (sortKeys.length > 1) sortKeys = sortKeys.filter(x => x !== k); }
  else sortKeys = sortKeys.concat([k]);
  save('sortk', sortKeys);
  const id = list[pos] && list[pos].id;
  rebuild(id); drawSort();
}

/* ---- summary table (T) ---- */
function tracks(it) {  // distinct audio tracks: codec + channels, main first
  const seen = new Set(), out = [];
  (it.audio || []).forEach(a => { const k = (a.codec || '?') + '|' + (a.ch || ''); if (!seen.has(k)) { seen.add(k); out.push(a); } });
  return out;
}
const TCOLS = [
  {k: 'artist', name: 'Artista', v: it => it.artist || '', sv: it => it.artist || it.title},
  {k: 'title', name: 'Titolo', v: it => it.title},
  {k: 'year', name: 'Anno', v: it => it.year || '', num: true},
  {k: 'fmt', name: 'Formato', v: it => it.fmt || '', sv: it => String(FMT_ORDER.indexOf(it.fmt) + 10)},
  {k: 'audio', name: 'Audio', v: it => (audioMain(it) || {}).codec || '', csv: it => tracks(it).map(a => a.codec).join(' / ')},
  {k: 'ch', name: 'Canali', v: it => (audioMain(it) || {}).ch || '', csv: it => tracks(it).map(a => a.ch).join(' / ')},
  {k: 'info', name: 'Info', nosort: true}
];
const TFILT = [
  {k: 'artist', name: 'Artista', get: it => it.artist ? [it.artist] : []}
];
let tf = {}, tq = '', tsort = {k: 'artist', dir: 1}, trows = [];
function tableOpen() { return $('table').style.display === 'flex'; }
function toggleTable(show) {
  const on = show != null ? show : !tableOpen();
  $('table').style.display = on ? 'flex' : 'none';
  $('tablebtn').classList.toggle('on', on);
  if (on) { drawTableBar(); drawTable(); }
}
function tableMatch(it, skip) {
  if (tq) {
    const hay = [it.title, it.artist, it.album, it.fmt, it.year].join(' ').toLowerCase();
    if (!tq.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  if (fsel.length && !fsel.includes(it.fmt)) return false;
  for (const F of TFILT) if (F.k !== skip && tf[F.k] && F.get(it).indexOf(tf[F.k]) < 0) return false;
  return true;
}
function drawTableBar() {
  let h = '<span class="tbtn back" id="tclose" title="Torna indietro (Esc)">&#8592; Indietro</span><h2>Riepilogo archivio</h2>' +
    '<input id="tq" placeholder="Cerca..." value="' + esc(tq) + '">';
  for (const F of TFILT) {
    const counts = {};
    A.items.filter(it => tableMatch(it, F.k)).forEach(it => new Set(F.get(it)).forEach(v => counts[v] = (counts[v] || 0) + 1));
    const vals = Object.keys(counts).sort(F.order ? (x, y) => F.order.indexOf(x) - F.order.indexOf(y) : coll.compare);
    h += '<label>' + F.name + '<select data-k="' + F.k + '"><option value="">Tutti</option>' +
      vals.map(v => '<option value="' + esc(v) + '"' + (tf[F.k] === v ? ' selected' : '') + '>' + esc(v) + ' (' + counts[v] + ')</option>').join('') + '</select></label>';
  }
  h += FORMATS.map(f => tag(f.id, fsel.includes(f.id) ? 'on' : '', ' data-f="' + esc(f.id) + '"')).join('');
  h += '<span class="tbtn" id="treset">Azzera</span><span class="tbtn" id="tcsv">Esporta CSV</span>';
  $('tbar').innerHTML = h;
  $('tbar').querySelectorAll('select').forEach(sl => sl.onchange = () => { tf[sl.dataset.k] = sl.value; drawTableBar(); drawTable(); });
  const q = $('tq');
  q.oninput = () => { tq = q.value.trim(); drawTable(); };
  q.onkeydown = e => { e.stopPropagation(); if (e.key === 'Escape') { q.value = ''; tq = ''; drawTable(); q.blur(); } };
  $('tbar').querySelectorAll('.ftag[data-f]').forEach(t => t.onclick = () => toggleFmt(t.dataset.f));
  $('treset').onclick = () => { tf = {}; tq = ''; fsel = []; save('fsel', fsel); rebuild(); drawTableBar(); drawTable(); };
  $('tcsv').onclick = exportCsv;
  $('tclose').onclick = () => toggleTable(false);
}
function trackSelect(it, i, field) {  // Audio and Canali: one drop-down per column, linked on the same track
  const tr = tracks(it);
  if (tr.length < 2) return esc((tr[0] || {})[field] || '');
  return '<select class="trk" data-i="' + i + '" data-f="' + field + '">' +
    tr.map((a, n) => '<option value="' + n + '">' + esc(a[field] || '?') + '</option>').join('') + '</select>';
}
function drawTable() {
  const col = TCOLS.find(c => c.k === tsort.k) || TCOLS[0];
  trows = A.items.filter(it => tableMatch(it));
  trows.sort((a, b) => {
    const x = (col.sv || col.v)(a), y = (col.sv || col.v)(b);
    const r = col.num ? (x || 0) - (y || 0) : cmp(x, y);
    return (r || cmp(a.artist || a.title, b.artist || b.title) || cmp(a.title, b.title)) * tsort.dir;
  });
  $('tt').tHead.innerHTML = '<tr>' + TCOLS.map(c => '<th data-k="' + c.k + '" class="' + (c.k === tsort.k ? 'on' : '') + (c.nosort ? ' ns' : '') + '">' + c.name +
    (c.k === tsort.k ? (tsort.dir > 0 ? ' ▲' : ' ▼') : '') + '</th>').join('') + '</tr>';
  $('tt').tBodies[0].innerHTML = trows.map((it, i) => '<tr data-i="' + i + '">' + TCOLS.map(c => {
    if (c.k === 'fmt') return '<td>' + tag(it.fmt, 'solid') + '</td>';
    if (c.k === 'audio') return '<td>' + trackSelect(it, i, 'codec') + '</td>';
    if (c.k === 'ch') return '<td>' + trackSelect(it, i, 'ch') + '</td>';
    if (c.k === 'info') return '<td><span class="ibtn" title="Scheda completa">i</span></td>';
    const v = c.v(it);
    return '<td' + (c.num ? ' class="n"' : '') + ' title="' + esc(v) + '">' + esc(v) + '</td>';
  }).join('') + '</tr>').join('');
  const m = {}; trows.forEach(it => { if (it.fmt) m[it.fmt] = (m[it.fmt] || 0) + 1; });
  $('tstats').innerHTML = '<b>' + trows.length + '</b> elementi &nbsp;&middot;&nbsp; ' +
    FMT_ORDER.filter(f => m[f]).map(f => esc(f) + ' <b>' + m[f] + '</b>').join(' &nbsp; ');
}
function exportCsv() {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const cols = TCOLS.filter(c => c.k !== 'info');
  const head = cols.map(c => c.name).concat(['Percorso']);
  const lines = [head.map(q).join(';')].concat(trows.map(it => cols.map(c => q((c.csv || c.v)(it)))
    .concat([q(Object.values(it.copies || {}).join(' | '))]).join(';')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'archivio_kodi.csv'; document.body.appendChild(a); a.click(); a.remove();
}
$('tt').addEventListener('change', e => {
  const sl = e.target.closest('select.trk'); if (!sl) return;
  sl.closest('tr').querySelectorAll('select.trk').forEach(o => { o.value = sl.value; });
});
$('tt').addEventListener('click', e => {
  const th = e.target.closest('th');
  if (th) { if (th.classList.contains('ns')) return; tsort = {k: th.dataset.k, dir: tsort.k === th.dataset.k ? -tsort.dir : 1}; drawTable(); return; }
  if (e.target.closest('.ibtn')) openDetail(trows[+e.target.closest('tr').dataset.i]);
});
$('tt').addEventListener('dblclick', e => {
  const tr = e.target.closest('tr[data-i]');
  if (tr && !e.target.closest('select')) openDetail(trows[+tr.dataset.i]);
});
$('tablebtn').onclick = () => toggleTable();

$('tabs').addEventListener('click', e => { const t = e.target.closest('[data-f]'); if (t) toggleFmt(t.dataset.f); });
$('filters').addEventListener('click', e => { const t = e.target.closest('[data-f]'); if (t) toggleFmt(t.dataset.f); });
$('sortp').addEventListener('click', e => { const o = e.target.closest('[data-k]'); if (o) pickSort(o.dataset.k); });
$('sortbtn').onclick = () => toggleSort();
$('filtbtn').onclick = () => toggleFilters();
$('dclose').onclick = closeDetail;
$('detail').addEventListener('click', e => { if (e.target.id === 'detail' || e.target.id === 'dbg') closeDetail(); });
$('search').addEventListener('input', () => { query = $('search').value.trim(); rebuild(); });
$('search').addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('search').value = ''; query = ''; rebuild(); $('search').blur(); e.preventDefault(); }
  if (e.key === 'Enter' || e.key === 'ArrowDown') { $('search').blur(); e.preventDefault(); }
  e.stopPropagation();
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const det = $('detail').style.display === 'block';
  if (!det && tableOpen()) {
    if (e.target.tagName === 'SELECT') return;
    if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 't' || e.key === 'T') { toggleTable(false); e.preventDefault(); }
    return;
  }
  if (det) {
    if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'Enter') { closeDetail(); e.preventDefault(); }
    else if (e.key === 'ArrowDown') $('dtext').scrollBy(0, 80);
    else if (e.key === 'ArrowUp') $('dtext').scrollBy(0, -80);
    else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !tableOpen()) { closeDetail(); move(e.key === 'ArrowRight' ? 1 : -1); openDetail(); }
    return;
  }
  switch (e.key) {
    case 'ArrowRight': move(1); break;
    case 'ArrowLeft': move(-1); break;
    case 'PageDown': move(8); break;
    case 'PageUp': move(-8); break;
    case 'Home': pos = 0; render(); break;
    case 'End': pos = Math.max(0, list.length - 1); render(); break;
    case 'Enter': openDetail(); break;
    case 'ArrowDown': case 'ArrowUp': {   // all -> Blu-Ray -> DVD -> ... -> all
      const cur = fsel.length === 1 ? FMT_ORDER.indexOf(fsel[0]) + 1 : 0, n = FMT_ORDER.length + 1;
      const nx = (cur + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
      setFormats(nx ? [FMT_ORDER[nx - 1]] : []);
      break;
    }
    case '/': $('search').focus(); break;
    case 's': case 'S': toggleSort(); break;
    case 'f': case 'F': toggleFilters(); break;
    case 't': case 'T': toggleTable(true); break;
    case 'Escape':
      if ($('filters').style.display === 'block') toggleFilters(false);
      else if ($('sortp').style.display === 'block') toggleSort(false);
      else if (query) { $('search').value = ''; query = ''; rebuild(); }
      break;
    default:
      if (/^[1-9]$/.test(e.key) && FMT_ORDER[+e.key - 1]) toggleFmt(FMT_ORDER[+e.key - 1]);
      else if (e.key.length === 1 && /[a-z0-9]/i.test(e.key) && !e.ctrlKey && !e.altKey) jumpTo(e.key);
      else return;
  }
  e.preventDefault();
});
function move(d) { if (!list.length) return; pos = Math.max(0, Math.min(list.length - 1, pos + d)); render(); }
function jumpTo(ch) {   // like Kodi: a letter jumps to the first item starting with it (by the current sort)
  ch = ch.toLowerCase();
  const key = it => String(sortKeys.find(k => k !== 'fmt') === 'title' ? it.title : (it.artist || it.title)).toLowerCase();
  const i = list.findIndex((it, k) => k > pos && key(it).startsWith(ch));
  const j = i >= 0 ? i : list.findIndex(it => key(it).startsWith(ch));
  if (j >= 0) { pos = j; render(); }
}
let wheelLock = 0;
document.addEventListener('wheel', e => {
  if ($('detail').style.display === 'block' || tableOpen() || $('filters').contains(e.target) || $('sortp').contains(e.target)) return;
  const now = Date.now(); if (now - wheelLock < 90) return; wheelLock = now;
  move((e.deltaY || e.deltaX) > 0 ? 1 : -1);
}, {passive: true});
window.addEventListener('resize', () => { for (const c of cards.values()) c.remove(); cards.clear(); render(); });

$('foot').innerHTML = 'Copyright <a href="https://www.instagram.com/alexmancinifoto/" target="_blank">@Alexmancinifoto</a>';
$('bg2').style.opacity = '0';
rebuild();
})();
</script>
